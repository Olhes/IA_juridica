services:
  - type: web
    name: ia-juridica-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.production
    dockerContext: .
    envVars:
      - key: PORT
        value: 8000
      - key: WORKERS
        value: 1
      - key: COHERE_API_KEY
        sync: false
      - key: DATABASE_URL
        value: postgresql://ia_juridica_db_user:V349UCtHF7KQeSC59qqvIgzv4iG4uwgT@dpg-d9g4kimrnols73a23em0-a/ia_juridica_db
      - key: REDIS_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: NEO4J_ENABLED
        value: "true"
      - key: LOAD_LOCAL_KG
        value: "false"
      - key: QDRANT_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ANONYMOUS_SESSION_SECRET
        generateValue: true

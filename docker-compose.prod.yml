services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ia-juridica-backend:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - backend_docs:/app/backend/docs
      - backend_logs:/app/backend/logs
      - backend_temp:/app/backend/temp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ia-juridica-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FASTAPI_BASE_URL: http://backend:8000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  backend_docs:
  backend_logs:
  backend_temp:

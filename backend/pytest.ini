[pytest]
# ── Configuración del testing framework de IA Jurídica ────────────────────────

# Rutas de tests
testpaths = tests

# Plugins y opciones
asyncio_mode = auto

# Marcadores personalizados
markers =
    unit:        Tests unitarios (sin IO externo)
    integration: Tests de integración (mocks de Cohere, corpus real)
    e2e:         Tests end-to-end (requieren API en vivo)
    slow:        Tests lentos (>5s)

# Opciones por defecto al correr pytest
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Filtros de advertencias (suprimir deprecation de pydantic v1 en libs)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:lightrag.*
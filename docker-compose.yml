services:
  postgres:
    image: postgres:18.7-alpine
    container_name: ia_juridica_postgres
    environment:
      POSTGRES_DB: juridica_db
      POSTGRES_USER: juridica_user
      POSTGRES_PASSWORD: juridica_password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ia_juridica_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juridica_user -d juridica_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.12-alpine
    container_name: ia_juridica_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ia_juridica_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  ia_juridica_network:
    driver: bridge

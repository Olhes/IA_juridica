services:
  # Base de datos única: SurrealDB v4. El backend corre en el host (ver
  # backend/.env.example), por eso el puerto se publica en loopback y no hay
  # servicio `backend` aquí. Host 8010: el 8000 lo ocupa el backend FastAPI.
  surreal:
    image: surrealdb/surrealdb:v4.0.1
    container_name: ia_juridica_surreal
    environment:
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASSWORD: ${SURREAL_PASSWORD:-root}
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASSWORD:-root} --bind 0.0.0.0:8000 --log info rocksdb:/data/surreal.db
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      # Nombre explícito: el corpus SAT vive en `surreal_data` (rocksdb).
      - surreal_data:/data
    networks:
      - ia_juridica_network
    restart: unless-stopped
    healthcheck:
      # La imagen v4 es distroless (sin /bin/sh ni curl): el healthcheck debe
      # ejecutar el binario directamente.
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000", "--log", "none"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.3-alpine
    container_name: ia_juridica_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ia_juridica_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  surreal_data:
    # Volumen externo: guarda el corpus SAT; scripts/dev-full.mjs lo asegura antes de arrancar.
    name: surreal_data
    external: true
  redis_data:

networks:
  ia_juridica_network:
    driver: bridge

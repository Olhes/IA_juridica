[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-juridica"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.129.0",
  "uvicorn[standard]==0.41.0",

  "pydantic==2.12.5",
  "pydantic-settings==2.13.0",
  "pydantic-ai-slim[google,cohere]>=1.62.0,<2",

  "cohere==5.20.5",

  "docling>=2.74",
  "pypdf==6.7.0",
  "python-multipart==0.0.22",

  "lightrag-hku==1.4.9.11",
  "deepeval==3.8.4",

  "SQLAlchemy==2.0.46",
  "reportlab==4.4.10",

  "numpy>=2.4.2,<3.0",

  "slowapi==0.1.9",
  "python-dotenv==1.2.1",
  "loguru==0.7.3",
  "tqdm==4.67.3",
  "rich==14.3.2",
  "click==8.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "black==26.1.0",
  "flake8==7.3.0",
]

ml = [
  "httpx>=0.27,<1",
  "tenacity>=9.0,<10",
]

# OCR opcional: solo si realmente lo necesitas (scans)
# Nota: Docling expone extras de OCR (easyocr/tesserocr/rapidocr/etc.)
ocr = [
  "docling[easyocr]>=2.74",
]
[project.urls]
Homepage = "https://github.com/ia-juridica/ia-juridica"
Repository = "https://github.com/ia-juridica/ia-juridica"
Documentation = "https://github.com/ia-juridica/ia-juridica/blob/main/DOCUMENTATION.md"

[tool.setuptools]
# Evita que setuptools intente adivinar e incluya folders como frontend/node_modules/logs/etc.
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = [
  "frontend*",
  "node_modules*",
  "logs*",
  "temp*",
  "templates*",
  "evaluation*",
  "database*",
  "docs*",
]

[tool.setuptools.package-data]
backend = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.md", "**/*.txt"]

[pytest]
pythonpath = backend
testpaths = tests
python_files = test_*.py
norecursedirs = manual fixtures __pycache__ .pytest_cache
asyncio_mode = auto
addopts = --strict-markers
cache_dir = temp/pytest-cache
markers =
    unit: Pruebas unitarias sin IO externo
    integration: Integraciones con dependencias simuladas
    e2e: Pruebas de extremo a extremo
    slow: Pruebas lentas
    security: Autenticación, autorización, privacidad y carga segura
    http: Contratos HTTP offline con FastAPI TestClient
    contract: Schemas y formatos de salida
    bdd: Escenarios de comportamiento y limitaciones temporales
    benchmark: Mediciones locales informativas, sin umbral de velocidad
    quality: Controles del evaluador, sin llamadas a modelos
    model_quality: Evaluación real de generación y juez (requiere --run-model-evals)
